<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Navbar -->

<nav class="bg-green-700 text-white p-5">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Greenden</h1>
        <ul class="hidden md:flex gap-6">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

    <!-- Contact Section -->

    <section class="p-10">

        <h2 class="text-4xl font-bold text-center mb-10">
            Contact Us
        </h2>

        <form class="max-w-xl mx-auto bg-green-50 p-8 rounded shadow">

            <div class="mb-5">
                <label class="block mb-2">Name</label>

                <input type="text" class="w-full border p-3 rounded">
            </div>

            <div class="mb-5">
                <label class="block mb-2">Email</label>

                <input type="email" class="w-full border p-3 rounded">
            </div>

            <div class="mb-5">
                <label class="block mb-2">Message</label>

                <textarea rows="5" class="w-full border p-3 rounded">
                </textarea>
            </div>

            <button class="bg-green-700 text-white px-6 py-3 rounded hover:bg-green-900">

                Send Message

            </button>

        </form>

    </section>

    <footer class="bg-green-700 text-white text-center p-5">
        © 2025 Greenden
    </footer>

</body>

</html>
